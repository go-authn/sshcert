name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"
  # The judges are OpenSSH's ssh-keygen (ubuntu and macOS runners ship it),
  # and, on the `judges` lane, a real sshd and GÉANT's own code. With this
  # set, a lane where ssh-keygen is missing FAILS the oracle tests instead
  # of skipping them. Windows skips them by design.
  SSHCERT_REQUIRE_SSHKEYGEN: "1"
  # GÉANT's ssh-cert-tool, the judge of the differential tests and the
  # fail-open demonstration, at a pinned commit.
  GEANT_COMMIT: 5a4817753ffb32f25ce355efd670c41d0c46f933

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: true
          cache: true
      - name: oracle version
        if: matrix.os != 'windows-latest'
        run: ssh -V
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go test -count=1 -v ./...

  judges:
    name: judges (sshd, GÉANT's code)
    runs-on: ubuntu-latest
    env:
      SSHCERT_REQUIRE_SSHD: "1"
      SSHCERT_REQUIRE_GEANT: "1"
      SSHCERT_GEANT_JUDGE: /opt/sshcert-judges/sshcert-geant-judge
      SSHCERT_GEANT_AUTHORIZE: /opt/sshcert-judges/ssh-cert-authorize
      SSHCERT_AUTHORIZE: /opt/sshcert-judges/sshcert-authorize
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1', check-latest: true, cache: true }
      - name: sshd
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server openssh-client
          sudo mkdir -p /run/sshd
          ssh -V
      - name: GÉANT's ssh-cert-tool, and this command, installed where sshd runs them
        # sshd runs an AuthorizedPrincipalsCommand only from a path owned by
        # root and writable by no one else, and on the runner /usr/local/bin
        # is not (sshd: "bad ownership or modes for directory").
        run: |
          git clone -q https://gitlab.geant.org/core-aai-platform/ssh-cert-tool.git "$RUNNER_TEMP/geant"
          git -C "$RUNNER_TEMP/geant" checkout -q "$GEANT_COMMIT"
          testdata/geantjudge/build.sh "$RUNNER_TEMP/judges" "$RUNNER_TEMP/geant"
          go build -o "$RUNNER_TEMP/judges/sshcert-authorize" ./cmd/sshcert-authorize
          sudo install -d -o root -g root -m 0755 /opt/sshcert-judges
          ls -ld / /opt /opt/sshcert-judges
          for b in sshcert-geant-judge ssh-cert-authorize sshcert-authorize; do
            sudo install -o root -g root -m 0755 "$RUNNER_TEMP/judges/$b" /opt/sshcert-judges/$b
          done
      - name: differential tests against GÉANT's matcher and parser
        run: go test -count=1 -v -run 'GEANT' .
      - name: real sshd logins, ours against GÉANT's
        run: go test -count=1 -v -run 'SSHD' ./cmd/sshcert-authorize

  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1', check-latest: true, cache: true }
      - run: go test -race -count=1 ./...

  coverage:
    name: coverage (the standard is 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1', check-latest: true, cache: true }
      - run: |
          FLOOR=100.0
          # The output is kept and shown on failure: sent to /dev/null, a
          # failing test here would be an exit code and nothing else.
          if ! go test -coverprofile=cover.out -coverpkg=./... ./... > test.log 2>&1; then
            grep -E -B2 -A25 -- '--- FAIL|^panic:|build failed' test.log || tail -100 test.log
            exit 1
          fi
          go tool cover -func=cover.out
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%  floor: ${FLOOR}%  standard: 100%"
          if awk -v c="$cov" -v f="$FLOOR" 'BEGIN{exit !(c+0 < f+0)}'; then
            echo "::error::coverage ${cov}% fell below the recorded floor ${FLOOR}%"
            exit 1
          fi

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1', check-latest: true, cache: true }
      - run: go test -run '^$' -fuzz '^FuzzParseDomainGrant$' -fuzztime 60s .
      - run: go test -run '^$' -fuzz '^FuzzMatchDomain$' -fuzztime 60s .

  arches:
    name: arch ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1', check-latest: true, cache: true }
      - run: GOARCH=${{ matrix.goarch }} go build ./...
      - name: Install qemu-user-static
        if: matrix.goarch != 'amd64' && matrix.goarch != 'arm64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
      - name: Test
        run: |
          case "${{ matrix.goarch }}" in
            amd64|arm64) go test -count=1 ./... ;;
            riscv64)  GOARCH=riscv64 go test -count=1 -exec=qemu-riscv64-static ./... ;;
            loong64)  GOARCH=loong64 go test -count=1 -exec=qemu-loongarch64-static ./... ;;
            ppc64le)  GOARCH=ppc64le go test -count=1 -exec=qemu-ppc64le-static ./... ;;
            s390x)    GOARCH=s390x   go test -count=1 -exec=qemu-s390x-static ./... ;;
          esac
